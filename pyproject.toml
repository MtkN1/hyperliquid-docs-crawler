[project]
name = "hyperliquid-docs-crawler"
version = "0.1.0"
description = "Retrieve Hyperliquid DEX docs as Markdown files."
readme = "README.md"
authors = [
    { name = "MtkN1", email = "51289448+MtkN1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.12.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
